name: Docs Agent

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Validate the run without starting a live agent run'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  docs-agent:
    uses: Automattic/docs-agent/.github/workflows/maintain-docs.yml@main
    with:
      audience: user
      run_kind: bootstrap
      base_ref: main
      docs_branch: docs-agent/user-docs
      writable_paths: docs/user/**
      context_repositories: >-
        [{"alias":"docs-network","repository":"Extra-Chill/extrachill-docs"}]
      bootstrap_contract: >-
        {"required_globs":[{"pattern":"docs/user/*.md","min":5}],"forbidden_phrases":["following users"]}
      prompt: >-
        Follow runner-configs/writing-rules.md in Extra-Chill/extrachill-docs verbatim as the network's voice standard: plain language, lead with the benefit, and never name plugins, tools, vendors, or anything technical. Write for forum members, music fans and contributors using the discussion boards, profiles, upvoting, ranks and notifications. Extra Chill has no follow feature or follower graph; never describe following users. Cover what the published Community help already covers so nothing is lost: getting started, using the forums, sharing music, setting up your profile, upvoting, community ranks, and notifications. Ground every article in current product behavior from this repository's source.
      dry_run: ${{ inputs.dry_run || false }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EXTERNAL_PACKAGE_SOURCE_POLICY: ${{ secrets.DOCS_AGENT_EXTERNAL_PACKAGE_SOURCE_POLICY }}
